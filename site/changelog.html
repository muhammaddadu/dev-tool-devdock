<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Changelog — DevDock</title>
    <meta name="description" content="What's new in DevDock — rendered from the project's CHANGELOG.md on GitHub." />
    <link rel="icon" type="image/svg+xml" href="./assets/devdock.svg" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <header class="nav">
      <div class="container nav__inner">
        <a href="./" class="brand" aria-label="DevDock home">
          <span class="brand__mark" aria-hidden="true"></span>
          <span>DevDock</span>
        </a>
        <nav class="nav__links" aria-label="Primary">
          <a class="nav__link" href="./#features">Features</a>
          <a class="nav__link" href="./#how-it-works">How it works</a>
          <a class="nav__link" href="./changelog.html" aria-current="page">Changelog</a>
          <a class="nav__link" href="https://github.com/muhammaddadu/dev-tool-devdock">GitHub</a>
        </nav>
        <a class="nav__cta" href="https://github.com/muhammaddadu/dev-tool-devdock/releases/latest">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Download
        </a>
      </div>
    </header>

    <main>
      <article class="markdown" id="changelog">
        <a class="changelog-back" href="./">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          Back to overview
        </a>
        <div id="changelog-content">
          <div class="spinner" aria-label="Loading changelog"></div>
        </div>
        <p style="margin-top:48px;color:var(--text-mute);font-size:13px;">
          Rendered live from
          <a href="https://github.com/muhammaddadu/dev-tool-devdock/blob/main/CHANGELOG.md"><code>CHANGELOG.md</code> on GitHub</a>.
          Per-release notes are also attached to each <a href="https://github.com/muhammaddadu/dev-tool-devdock/releases">GitHub Release</a>.
        </p>
      </article>
    </main>

    <footer>
      <div class="container">
        <div class="brand" style="font-size:14px;">
          <span class="brand__mark" style="width:22px;height:22px;border-radius:6px;" aria-hidden="true"></span>
          <span>DevDock</span>
        </div>
        <div class="links">
          <a href="./changelog.html">Changelog</a>
          <a href="https://github.com/muhammaddadu/dev-tool-devdock">GitHub</a>
          <a href="https://github.com/muhammaddadu/dev-tool-devdock/blob/main/LICENSE">MIT License</a>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <script>
      (async () => {
        const target = document.getElementById("changelog-content");
        const sources = [
          // Same-repo raw on main — works on Pages and locally if served alongside.
          "https://raw.githubusercontent.com/muhammaddadu/dev-tool-devdock/main/CHANGELOG.md",
          // Relative fallback for local file-system previews.
          "../CHANGELOG.md",
        ];

        let md = null;
        let lastErr = null;
        for (const url of sources) {
          try {
            const res = await fetch(url, { cache: "no-cache" });
            if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
            md = await res.text();
            break;
          } catch (e) {
            lastErr = e;
          }
        }

        if (md === null) {
          target.innerHTML = `
            <h1>Couldn't load changelog</h1>
            <p>We couldn't fetch <code>CHANGELOG.md</code>. You can read it directly on
            <a href="https://github.com/muhammaddadu/dev-tool-devdock/blob/main/CHANGELOG.md">GitHub</a>.</p>
            <pre><code>${String(lastErr).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c])}</code></pre>
          `;
          return;
        }

        marked.setOptions({ gfm: true, breaks: false });
        const dirty = marked.parse(md);
        const clean = window.DOMPurify ? DOMPurify.sanitize(dirty) : dirty;
        target.innerHTML = clean;

        // Rewrite relative links so they keep working from /docs.
        target.querySelectorAll("a[href]").forEach((a) => {
          const href = a.getAttribute("href");
          if (!href) return;
          if (/^(https?:|mailto:|#)/i.test(href)) return;
          // Relative links in CHANGELOG.md are relative to the repo root, so
          // point them at the GitHub blob view.
          a.setAttribute(
            "href",
            "https://github.com/muhammaddadu/dev-tool-devdock/blob/main/" + href.replace(/^\.?\//, "")
          );
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener");
        });
      })();
    </script>
  </body>
</html>
