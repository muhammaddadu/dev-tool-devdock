<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="DevDock — manage local development services from your menu bar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1f2937" stroke-width="1" opacity="0.5">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280"/>
    <path d="M80 0 V360 M160 0 V360 M240 0 V360 M320 0 V360 M400 0 V360 M480 0 V360 M560 0 V360 M640 0 V360 M720 0 V360 M800 0 V360 M880 0 V360 M960 0 V360 M1040 0 V360 M1120 0 V360 M1200 0 V360"/>
  </g>

  <!-- Left: brand -->
  <g transform="translate(72, 90)">
    <!-- logo tile -->
    <rect width="96" height="96" rx="22" fill="#0b0d12" stroke="#374151" stroke-width="1.5"/>
    <rect x="18" y="28" width="60" height="42" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>
    <circle cx="30" cy="40" r="3" fill="#22c55e" filter="url(#glow)"/>
    <circle cx="40" cy="40" r="3" fill="#f59e0b"/>
    <circle cx="50" cy="40" r="3" fill="#ef4444"/>
    <rect x="26" y="50" width="42" height="3.5" rx="1.75" fill="#9ca3af"/>
    <rect x="26" y="58" width="30" height="3.5" rx="1.75" fill="#6b7280"/>

    <text x="118" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="56" font-weight="700" fill="#f9fafb">DevDock</text>
    <text x="120" y="80" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="20" fill="#9ca3af">Manage local dev services from your menu bar</text>

    <g transform="translate(120, 110)" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#d1d5db">
      <rect width="120" height="28" rx="14" fill="#0b0d12" stroke="#374151"/>
      <circle cx="16" cy="14" r="4" fill="#22c55e"/>
      <text x="28" y="18">macOS · Tauri</text>

      <g transform="translate(132, 0)">
        <rect width="110" height="28" rx="14" fill="#0b0d12" stroke="#374151"/>
        <circle cx="16" cy="14" r="4" fill="#06b6d4"/>
        <text x="28" y="18">React · Rust</text>
      </g>

      <g transform="translate(252, 0)">
        <rect width="92" height="28" rx="14" fill="#0b0d12" stroke="#374151"/>
        <circle cx="16" cy="14" r="4" fill="#f59e0b"/>
        <text x="28" y="18">SQLite</text>
      </g>
    </g>
  </g>

  <!-- Right: faux menubar dropdown -->
  <g transform="translate(820, 56)">
    <rect width="380" height="248" rx="18" fill="url(#card)" stroke="#374151" stroke-width="1.5"/>
    <!-- title bar -->
    <g transform="translate(20, 18)" font-family="-apple-system, system-ui, sans-serif" fill="#f3f4f6">
      <text font-size="14" font-weight="600">Localhost</text>
      <text x="320" font-size="12" fill="#9ca3af" text-anchor="end">5 services</text>
    </g>
    <line x1="20" y1="46" x2="360" y2="46" stroke="#374151"/>

    <!-- rows -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <g transform="translate(20, 64)">
        <circle cx="6" cy="6" r="5" fill="#22c55e"/>
        <text x="20" y="10" fill="#e5e7eb">:3000</text>
        <text x="90" y="10" fill="#9ca3af">web · next dev</text>
        <text x="340" y="10" fill="#6b7280" text-anchor="end">running</text>
      </g>
      <g transform="translate(20, 96)">
        <circle cx="6" cy="6" r="5" fill="#22c55e"/>
        <text x="20" y="10" fill="#e5e7eb">:5432</text>
        <text x="90" y="10" fill="#9ca3af">postgres</text>
        <text x="340" y="10" fill="#6b7280" text-anchor="end">running</text>
      </g>
      <g transform="translate(20, 128)">
        <circle cx="6" cy="6" r="5" fill="#f59e0b"/>
        <text x="20" y="10" fill="#e5e7eb">:8080</text>
        <text x="90" y="10" fill="#9ca3af">api · cargo run</text>
        <text x="340" y="10" fill="#6b7280" text-anchor="end">starting</text>
      </g>
      <g transform="translate(20, 160)">
        <circle cx="6" cy="6" r="5" fill="#6b7280"/>
        <text x="20" y="10" fill="#e5e7eb">:6379</text>
        <text x="90" y="10" fill="#9ca3af">redis</text>
        <text x="340" y="10" fill="#6b7280" text-anchor="end">stopped</text>
      </g>
      <g transform="translate(20, 192)">
        <circle cx="6" cy="6" r="5" fill="#ef4444"/>
        <text x="20" y="10" fill="#e5e7eb">:4000</text>
        <text x="90" y="10" fill="#9ca3af">workers · failed</text>
        <text x="340" y="10" fill="#6b7280" text-anchor="end">errored</text>
      </g>
    </g>

    <!-- footer -->
    <line x1="20" y1="216" x2="360" y2="216" stroke="#374151"/>
    <g transform="translate(20, 230)" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#9ca3af">
      <text>⌘ N  new service</text>
      <text x="340" text-anchor="end" fill="url(#accent)">Scan</text>
    </g>
  </g>
</svg>
